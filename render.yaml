services:
  - type: web
    name: marketnayo-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketnayo-db
          property: connectionString
      - key: SECRET_KEY
        sync: false

databases:
  - name: marketnayo-db
    databaseName: marketnayo
    user: postgres